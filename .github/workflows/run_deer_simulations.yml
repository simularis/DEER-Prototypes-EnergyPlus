name: Run DEER simulations

run-name: >-
  Simulate ${{ inputs.measure_path }}
  from ${{ inputs.model_ref }} using ${{ inputs.run_profile }} profile
  by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      model_ref:
        description: Git branch, tag, or SHA
        required: true
        type: string
      measure_path:
        description: "Repository-relative path to the measure folder"
        required: true
        type: string
      run_profile:
        description: "Requested compute profile"
        required: true
        type: choice
        options:
          - test
          - standard
          - large
      compose_only:
        description: "Compose models without running EnergyPlus"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.model_ref }}

      - name: Capture commit SHA
        id: gitinfo
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Validate measure path
        shell: bash
        run: |
          test -d "${{ inputs.measure_path }}"
          case "${{ inputs.measure_path }}" in
            "commercial measures/"*|"residential measures/"*) ;;
            *) echo "Invalid measure path"; exit 1 ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SIMULATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Show final command
        run: |
          echo "${{ inputs.measure_path }}"
          echo "${{ steps.gitinfo.outputs.sha }}"

      - name: Launch simulation
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "commands=\"pwsh C:\\Scripts\\RunDeerSimulation.ps1 -RunId ${{ github.run_id }} -Repository ${{ github.repository }} -CommitSha ${{ steps.gitinfo.outputs.sha }} -MeasurePath \\\"${{ inputs.measure_path }}\\\" -S3Bucket ${{ vars.SIMULATION_BUCKET }} --cloud-watch-output-config CloudWatchOutputEnabled=true\"")

      - name: Capture command ID
        id: commandinfo
        shell: bash
        run: |
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
