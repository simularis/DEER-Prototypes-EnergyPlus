name: Run DEER simulations

run-name: >-
  Simulate ${{ inputs.measure_path }}
  from ${{ inputs.model_ref }} using ${{ inputs.run_profile }} profile
  by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      model_ref:
        description: Git branch, tag, or SHA
        required: true
        type: string
      measure_path:
        description: "Repository-relative path to the measure folder"
        required: true
        type: string
      run_profile:
        description: "Requested compute profile"
        required: true
        type: choice
        options:
          - test
          - standard
          - large
      compose_only:
        description: "Compose models without running EnergyPlus"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simularis-gh-actions
          path: workflow_repo

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.model_ref }}

      - name: Capture commit SHA
        id: gitinfo
        shell: bash
        run: |
          echo "start_date=$(date)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Validate measure path
        shell: bash
        run: |
          test -d "${{ inputs.measure_path }}"
          case "${{ inputs.measure_path }}" in
            "commercial measures/"*|"residential measures/"*) ;;
            *) echo "Invalid measure path"; exit 1 ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SIMULATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Send the RunDeerSimulation script to S3
        id: sendScript
        shell: bash
        run: |
          aws s3 cp \
            workflow_repo/scripts/RunDeerSimulation.ps1 \
            "s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}/RunDeerSimulation.ps1"

      - name: Launch simulation
        id: launchSimulation
        shell: bash
        run: |
          # The bootstrap script downloads the simulation script and then launches it.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.SIMULATION_INSTANCE_ID }}" \
            --document-name "AWS-RunPowerShellScript" \
            --parameters "commands=\"pwsh C:/Scripts/BootstrapSimulation.ps1 -RunId ${{ github.run_id }} -Repository ${{ github.repository }} -CommitSha ${{ steps.gitinfo.outputs.sha }} -MeasurePath \\\"${{ inputs.measure_path }}\\\" -S3Bucket ${{ vars.SIMULATION_BUCKET }} \"" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true,CloudWatchLogGroupName="/aws/ssm/githubactions" \
            --query 'Command.CommandId' \
            --output text \
            )
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "## DEER Simulation Submitted" >> $GITHUB_STEP_SUMMARY
          echo "- Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit SHA: ${{ steps.gitinfo.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Measure path: ${{ inputs.measure_path }}" >> $GITHUB_STEP_SUMMARY
          echo "- SSM Command ID: $COMMAND_ID" >> $GITHUB_STEP_SUMMARY
          echo "- Log file: s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}/logs/RunDeerSimulation.log" >> $GITHUB_STEP_SUMMARY
          
      - name: Wait for simulation to complete
        shell: bash
        run: |
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --instance-id "${{ vars.SIMULATION_INSTANCE_ID }}" \
              --command-id "${{ steps.launchSimulation.outputs.command_id }}" \
              --query "Status" \
              --output text)
            echo "Current status: $STATUS"
            if [[ "$STATUS" == "Failed" ]]; then
                echo "SSM command failed"
                exit 1
            fi
            if [[ "$STATUS" == "Cancelled" ]]; then
                echo "SSM command cancelled"
                exit 1
            fi
            if [[ "$STATUS" == "Success" ]]; then
                break
            fi
            sleep 30
          done

      - name: Download status file
        shell: bash
        run: |
          for i in {1..10}; do
            if aws s3 cp \
              "s3://${{ vars.SIMULATION_BUCKET }}/githubactions/${{ github.run_id }}/status.json" \
              status.json
            then
              break
            fi

            echo "Waiting for status.json..."
            sleep 10
          done

          cat status.json

      - name: Validate status
        shell: bash
        run: |
          STATUS=$(jq -r .Status status.json)

          if [[ "$STATUS" != "Success" ]]; then
            echo "Simulation failed"
            cat status.json
            exit 1
          fi

      - name: Add summary
        shell: bash
        run: |
          STATUS=$(jq -r .Status status.json)
          echo "## DEER Simulation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: $(jq -r .Repository status.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ steps.gitinfo.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Measure: ${{ inputs.measure_path }}" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime (seconds): $(jq -r .RunTimeSeconds status.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: $(jq -r .Status status.json)" >> $GITHUB_STEP_SUMMARY
          if [[ "$STATUS" != "Success" ]]; then
            echo "- Failure message: $(jq -r .FailureMessage status.json)" >> $GITHUB_STEP_SUMMARY
          fi
